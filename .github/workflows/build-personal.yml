name: Build (Personal)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build_fdroid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Packages auth
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        shell: bash
        run: |
          printf '%s\n' "gitHubToken=${GITHUB_TOKEN}" > user.properties

      - uses: ./.github/actions/setup-android-build

      - name: Configure Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          bundler-cache: true

      - name: Build F-Droid release signed with debug keystore
        run: |
          bundle update fastlane
          bundle exec fastlane assembleFDroidReleaseApk storeFile:debug.keystore storePassword:android keyAlias:androiddebugkey keyPassword:android

      - uses: actions/upload-artifact@v4
        with:
          name: com.x8bit.bitwarden-fdroid.apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error